<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <form id="to-do-app">
      <h1>Lista zakupów do kupienia</h1>

      <label for="text">Wpisz potrzebne produkty na liste</label>
      <input type="text" name="text" id="text" placeholder="Banan" /><br />

      <ul id="shopping-list"></ul>

      <button type="submit" id="add">Dodaj</button>
      <button type="button" id="delete">Usuń</button>
      <button type="button" id="switch">Tryb ciemny</button>
    </form>

    <script src="js/main.js"></script>
  </body>
</html>
